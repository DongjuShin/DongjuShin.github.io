name: Update citation counts

on:
  schedule:
    - cron: "17 21 * * *"   # daily, 06:17 KST
  workflow_dispatch:         # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Google Scholar citation counts
        run: python scripts/update_citations.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/citations.json; then
            echo "No change in citation counts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/citations.json
          git commit -m "Update citation counts"
          git push
